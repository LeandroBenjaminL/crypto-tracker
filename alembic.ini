[alembic]
script_location = migrations
prepend_sys_path = .

# La URL se configura vía DATABASE_URL en .env
# Para development local con SQLite:
#   sqlalchemy.url = sqlite:///crypto_tracker.db
# Para producción con PostgreSQL:
#   sqlalchemy.url = postgresql://user:pass@localhost:5432/cryptotracker
sqlalchemy.url =

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
