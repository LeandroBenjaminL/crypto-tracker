# Crypto Tracker — Docker Compose
#
# Arranca tres servicios:
#   1. db (PostgreSQL) → puerto 5432
#   2. api (FastAPI)   → http://localhost:8000  — docs en /docs
#   3. streamlit (UI)  → http://localhost:8501
#
# Uso:
#   docker compose up -d          # arrancar en background
#   docker compose logs -f        # ver logs en vivo
#   docker compose down           # parar todo

services:
  # ------------------------------------------------------------------
  # Base de datos (PostgreSQL)
  # ------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptotracker
      POSTGRES_PASSWORD: cryptotracker
      POSTGRES_DB: cryptotracker
    ports:
      - "5432:5432"
    volumes:
      - crypto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cryptotracker"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------------
  # API REST (FastAPI)
  # ------------------------------------------------------------------
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - COINGECKO_BASE_URL=https://api.coingecko.com/api/v3
      - DATABASE_URL=postgresql://cryptotracker:cryptotracker@db:5432/cryptotracker
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ------------------------------------------------------------------
  # Dashboard (Streamlit)
  # ------------------------------------------------------------------
  streamlit:
    build:
      context: .
    command: >
      streamlit run app.py
      --server.port=8501
      --server.headless=true
      --server.enableCORS=true
    ports:
      - "8501:8501"
    environment:
      # Apunta a la API por el nombre del servicio de Docker Compose.
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  crypto_pgdata:
    # Volumen para persistir PostgreSQL entre reinicios
