# --- Linting & Typing ---
static_analysis:
  linter:
    name: ruff
    line_length: 120
    target_version: py310
    rules:
      - E
      - F
      - I
      - N
      - W
  type_checker:
    name: mypy
    python_version: "3.10"
    plugins:
