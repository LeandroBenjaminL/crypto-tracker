      steps:
        - ruff
        - mypy
        - pytest
        - coverage
      python_matrix:
        - "3.10"
        - "3.11"
        - "3.12"
    - name: "Pipeline ETL (pipeline.yml)"
      triggers:
        - workflow_dispatch
      cron: "*/30 * * * * (disabled)"
      entrypoint: "crypto-tracker pipeline --top 100"
    - name: "Frontend Deploy (frontend.yml)"
      triggers:
        - "push/main paths:frontend/**"
      deploy_to: github-pages
  docker:
    compose: docker-compose.yml
    dockerfile: Dockerfile
    services:
      - "db (postgres:16-alpine)"
      - "api (fastapi)"
      - streamlit
    base_image: "python:3.12-slim"
    entrypoints:
      - api
      - streamlit
      - pipeline
      - telegram

# --- Architecture ---
architecture:
  pattern: clean-architecture
  layers:
    - name: core
      deps: []
      rules: "No external dependencies, pure Python domain logic"
    - name: adapters
      deps:
        - core
      rules: "Implements interfaces core expects"
    - name: api
      deps:
        - core
        - adapters
      rules: "FastAPI, exposes core logic as REST"
    - name: cli
      deps:
        - core
      rules: "Click-based, no direct adapter coupling"
    - name: streamlit
      deps:
        - api
      rules: "Consumes API via HTTP, does not import core directly"
    - name: telegram
      deps:
        - core
      rules: "Telegram bot interface"
    - name: frontend (astro)
      deps:
        - api
      rules: "Static site, client-side data fetching from API"
  golden_rule: "core must not know about HTTP, terminal, or web"

