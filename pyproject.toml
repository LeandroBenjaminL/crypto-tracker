[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-tracker"
version = "0.1.0"
description = "CLI tool to track cryptocurrency prices and manage favorites"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Leandro", email = "leandro@example.com" }
]
keywords = ["crypto", "cli", "tracker", "coin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Dependencias del proyecto
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0",
]

# Extras opcionales
[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9",  # Driver PostgreSQL (solo si usás DB)
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",  # Para tests de cliente HTTP
    "ruff>=0.1.0",    # Linter rápido
    "mypy>=1.7.0",    # Tipado estático
    "pandas-stubs>=2.0.0",  # Type stubs para pandas (mypy)
    "types-requests>=2.31.0",  # Type stubs para requests (mypy)
    "alembic>=1.13",  # Migraciones de base de datos
]

# Script de entrada (cómo se ejecuta el CLI)
[project.scripts]
crypto-tracker = "src.cli.commands:main"

# Configuración de herramientas
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]  # Errores, imports, naming

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.10"
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true

# SQLAlchemy tiene falsos positivos con mypy en Column assignment
[[tool.mypy.overrides]]
module = "src.adapters.database"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.core.pipeline"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.api.client"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.api.server"
ignore_errors = true
